[project]
name = "tasko"
version = "0.0.8"
description = "Personal task manager"
readme = "README.md"
authors = [{ name = "pybass" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dependencies = [
    "cyclopts==5.1.1",
    "rich==15.0.0",
    "textual==8.2.8",
]

[project.urls]
Repository = "https://github.com/pybass/tasko"
Issues = "https://github.com/pybass/tasko/issues"

[project.scripts]
tasko = "tasko.cli.main:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]  # pinned: build backends live outside uv.lock
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff~=0.16.10",
    "mypy~=2.4.0",
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "pytest-xdist~=3.8.0",
    "pip-audit~=2.10.1",
    "pre-commit~=4.6.2",
]

[tool.uv]
required-version = ">=0.12"
publish-url = "https://upload.pypi.org/legacy/"
check-url = "https://pypi.org/simple/"  # lets a failed release re-run: uploaded files are skipped

[tool.ruff]
line-length = 130
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Tool conflicts
    "COM812",   # trailing-comma — handled by ruff formatter
    "ISC001",   # implicit-string-concat — conflicts with ruff formatter
    "D203",     # conflicts with D211
    "D213",     # conflicts with D212
    # Style preferences
    "PLC0414",  # `import x as x` is our re-export marker
    "RET503",   # explicit None returns are noisy
    "G004",     # f-strings in logging are fine
    "PT001", "PT006", "PT007", "PT023",  # cosmetic pytest-style rules
    "D401",     # non-imperative-mood — fights noun-phrase docstrings (OpenAPI summaries) and fires inconsistently
    # Categories that fight our style
    "FIX",      # TODOs are fine
    "FBT",      # boolean-trap — too restrictive
    "EM",       # inline error messages are fine
    "CPY",      # no copyright headers — per-file headers add nothing
    "TC",       # TYPE_CHECKING blocks: import noise, break pydantic runtime annotations
    "TRY003",   # raise-vanilla-args — too noisy
    "C901",     # complexity — judgment call
    "PLR0911", "PLR0912", "PLR0913", "PLR0917", "PLR2004",  # soft pylint thresholds
    "TD002", "TD003",  # TODO author/link — optional
    "ASYNC109", # async-function-with-timeout — debatable
    "D1",       # no docstring-coverage mandate — a docstring is written only where it adds contract
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.field_validator"]  # N805: cls is correct without @classmethod

[tool.ruff.lint.pydocstyle]
ignore-decorators = ["typing.override", "typing.overload"]  # the base class / overload stub carries the contract

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S", "SLF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
# No "unused-awaitable": Textual's mount/push_screen/remove return awaitables that are optional to
# await — the work is already scheduled, so awaiting them is a choice, not a requirement.
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool", "exhaustive-match"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
warn_unused_ignores = false

[tool.codespell]
skip = "uv.lock,.git,.venv,.mypy_cache,.ruff_cache,.pytest_cache"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
filterwarnings = ["error"]  # targeted ignores go after "error"
asyncio_mode = "auto"  # Textual Pilot tests are plain `async def`
asyncio_default_fixture_loop_scope = "function"
